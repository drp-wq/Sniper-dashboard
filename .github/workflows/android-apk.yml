name: Build Android APK (Sniper Paper Bot)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Assets
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI & Sync
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew || true
          ./gradlew assembleDebug --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk ./sniper-paper-bot.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sniper-paper-bot-debug.apk
          path: sniper-paper-bot.apk
          retention-days: 14
